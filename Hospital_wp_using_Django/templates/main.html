<!DOCTYPE html>
{% load static %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'styles/style.css' %}" />
    <title>AK Hospital</title>
  </head>

  <body class="bg-gray-100 text-gray-800">
    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Flash Messages -->
    {% if messages %}
    <div class="container mx-auto p-4">
      <ul class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative">
        {% for message in messages %}
        <li class="mb-2">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <!-- Content Block -->
    <main class="container mx-auto py-6 px-4">
      {% block content %}
      <!-- Dynamic content will go here -->
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-4">
      <div class="container mx-auto text-center">
        <p>&copy; 2025 AK Hospital Management. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
